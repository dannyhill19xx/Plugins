modules:
  # Read-only custom field. Values are written only by this app
  # via PUT /rest/api/3/app/field/{fieldId}/value.
  jira:customField:
    - key: last-comment-field
      name: Last comment
      description: Text of the most recent public comment on the issue
      type: string
      readOnly: true
    # Service projects only: who is waiting for whom, and since when.
    - key: last-customer-reply
      name: Last customer reply
      description: When the customer last replied on the request
      type: datetime
      readOnly: true
    - key: last-agent-reply
      name: Last agent reply
      description: When an agent last replied to the customer on the request
      type: datetime
      readOnly: true
    - key: last-reply-by
      name: Last reply by
      description: Who replied last on the request, Customer or Agent
      type: string
      readOnly: true

  trigger:
    # Recalculate the field whenever comments change.
    - key: comment-trigger
      function: on-comment
      events:
        - avi:jira:commented:issue
        - avi:jira:deleted:comment
    # Fill the field for existing issues right after install.
    - key: install-trigger
      function: on-installed
      events:
        - avi:forge:installed:app

  # Backfill runs as a chain of queue events, one page of issues per event.
  consumer:
    - key: backfill-consumer
      queue: backfill-queue
      resolver:
        function: backfill-worker
        method: backfill-batch

  jira:adminPage:
    - key: lcf-admin
      title: Last comment field
      resource: admin-ui
      resolver:
        function: admin-resolver
      render: native
      useAsConfig: true

  function:
    - key: on-comment
      handler: index.onComment
    - key: on-installed
      handler: index.onInstalled
    - key: backfill-worker
      handler: index.backfillConsumer
      timeoutSeconds: 120
    - key: admin-resolver
      handler: index.adminResolver

resources:
  - key: admin-ui
    path: src/frontend/index.tsx

app:
  id: ari:cloud:ecosystem::app/REPLACE-ME   # filled in by `forge register`
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user # agent check: /rest/api/3/user/permission/search
    - storage:app
